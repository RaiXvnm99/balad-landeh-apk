# NETLIFY CONFIGURATION - ALLOW CAMERA & GEOLOCATION
[build]
  publish = "."

# SECURITY HEADERS
[[headers]]
  for = "/*"
  [headers.values]
    # Allow geolocation dan camera
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=()"
    # CORS headers
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    # Security headers
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Feature policy untuk geolocation
    Feature-Policy = "geolocation 'self'; camera 'self'"

# Cache busting untuk index.html
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Manifest harus dikirim dengan content-type yang benar supaya
# PWA2APK / Android bisa mem-verifikasi web app manifest dengan cepat
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache, no-store, must-revalidate"

# Service worker JANGAN di-cache lama-lama, supaya update ke-push cepat
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript"

[[headers]]
  for = "/OneSignalSDKWorker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript"
